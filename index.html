<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資訊工程每日 5 大精選焦點</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-12">
    <!-- 標題區域 -->
    <header class="mb-10 text-center">
      <div class="inline-block px-3 py-1 bg-blue-100 text-blue-700 text-xs font-semibold rounded-full mb-3">
        每日早上 08:00 自動更新
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight sm:text-4xl">
        資工界每日五大核心新聞
      </h1>
      <p id="updated-time" class="mt-3 text-sm text-slate-500">
        正在載入最新摘要...
      </p>
    </header>

    <!-- 條列式新聞列表 -->
    <main>
      <ol id="news-list" class="space-y-6">
        <!-- 骨架載入動畫 -->
        <li class="p-6 bg-white rounded-2xl shadow-sm border border-slate-200 animate-pulse">
          <div class="h-5 bg-slate-200 rounded w-3/4 mb-3"></div>
          <div class="h-4 bg-slate-100 rounded w-full mb-2"></div>
          <div class="h-4 bg-slate-100 rounded w-1/2"></div>
        </li>
      </ol>
    </main>

    <footer class="mt-14 text-center text-xs text-slate-400">
      資料來源匯整自 Hacker News、Ars Technica、InfoQ 等權威工程頻道
    </footer>
  </div>

  <script>
    async function loadDailyNews() {
      const listElement = document.getElementById('news-list');
      const timeElement = document.getElementById('updated-time');

      try {
        // 加入時間戳以避免快取
        const res = await fetch(`data/news.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error('新聞資料暫時無法載入');
        const data = await res.json();

        timeElement.textContent = `最後更新時間：${data.updated_at}`;
        listElement.innerHTML = '';

        if (!data.articles || data.articles.length === 0) {
          listElement.innerHTML = `<li class="p-6 bg-white rounded-xl text-center text-slate-500">目前尚無更新文章。</li>`;
          return;
        }

        data.articles.forEach((item, index) => {
          const card = document.createElement('li');
          card.className = "p-6 bg-white rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow relative overflow-hidden";
          card.innerHTML = `
            <div class="flex items-start gap-4">
              <span class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-blue-50 text-blue-600 font-bold text-sm">
                0${index + 1}
              </span>
              <div class="flex-1 min-w-0">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="group">
                  <h2 class="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition-colors line-clamp-2">
                    ${item.title}
                  </h2>
                </a>
                <p class="mt-2 text-sm text-slate-600 leading-relaxed">
                  ${item.summary}
                </p>
                <div class="mt-4 flex flex-wrap items-center gap-y-2 gap-x-4 text-xs text-slate-400">
                  <span class="inline-flex items-center gap-1 font-medium text-slate-600 bg-slate-100 px-2 py-0.5 rounded">
                    來源：${item.source}
                  </span>
                  <span>發布於：${item.published_at}</span>
                  <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-blue-500 hover:underline inline-flex items-center ml-auto">
                    閱讀原始文章 &rarr;
                  </a>
                </div>
              </div>
            </div>
          `;
          listElement.appendChild(card);
        });
      } catch (err) {
        timeElement.textContent = '載入失敗';
        listElement.innerHTML = `<li class="p-6 bg-red-50 text-red-600 rounded-xl text-center text-sm">${err.message}</li>`;
      }
    }

    loadDailyNews();
  </script>
</body>
</html>

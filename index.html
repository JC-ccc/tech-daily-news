<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日科技與資安焦點（民生重大＋資工核心）</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-12">
    <!-- 頂部標題 -->
    <header class="mb-10 text-center">
      <div class="inline-block px-3 py-1 bg-blue-100 text-blue-700 text-xs font-semibold rounded-full mb-3">
        每日早上 08:00 自動彙整更新
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight sm:text-4xl">
        每日焦點科技與民生資安要聞
      </h1>
      <p id="updated-time" class="mt-3 text-sm text-slate-500">
        正在載入最新摘要...
      </p>
    </header>

    <main class="space-y-12">
      <!-- 欄位一：與一般大眾相關之民生資安事件 (3 則) -->
      <section>
        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-amber-200">
          <span class="p-1.5 bg-amber-100 text-amber-700 rounded-lg text-lg">⚠️</span>
          <div>
            <h2 class="text-xl font-bold text-slate-900">民生與大眾生活相關事件 (Top 3)</h2>
            <p class="text-xs text-slate-500">系統中斷、重大漏洞、金融或隱私民生影響</p>
          </div>
        </div>
        <ol id="public-news-list" class="space-y-4">
          <li class="p-5 bg-white rounded-xl shadow-sm border border-slate-200 animate-pulse">
            <div class="h-5 bg-slate-200 rounded w-2/3 mb-2"></div>
            <div class="h-4 bg-slate-100 rounded w-full"></div>
          </li>
        </ol>
      </section>

      <!-- 欄位二：資工核心技術焦點 (5 則) -->
      <section>
        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-200">
          <span class="p-1.5 bg-blue-100 text-blue-700 rounded-lg text-lg">💻</span>
          <div>
            <h2 class="text-xl font-bold text-slate-900">資工界核心技術焦點 (Top 5)</h2>
            <p class="text-xs text-slate-500">架構演進、開源生態、系統開發與底層技術</p>
          </div>
        </div>
        <ol id="tech-news-list" class="space-y-4">
          <li class="p-5 bg-white rounded-xl shadow-sm border border-slate-200 animate-pulse">
            <div class="h-5 bg-slate-200 rounded w-2/3 mb-2"></div>
            <div class="h-4 bg-slate-100 rounded w-full"></div>
          </li>
        </ol>
      </section>
    </main>

    <footer class="mt-14 text-center text-xs text-slate-400">
      自動抓取彙整・摘要嚴格限制繁體中文 50 字以內
    </footer>
  </div>

  <script>
    function renderCard(item, index, badgeColor = "blue") {
      const isAmber = badgeColor === "amber";
      const badgeBg = isAmber ? "bg-amber-100 text-amber-800" : "bg-blue-50 text-blue-600";
      const hoverTitle = isAmber ? "group-hover:text-amber-700" : "group-hover:text-blue-600";
      const borderAccent = isAmber ? "border-amber-200 hover:border-amber-300 bg-amber-50/20" : "border-slate-200 hover:border-slate-300 bg-white";

      const card = document.createElement('li');
      card.className = `p-5 rounded-xl shadow-sm border transition-all ${borderAccent}`;
      card.innerHTML = `
        <div class="flex items-start gap-4">
          <span class="flex-shrink-0 flex items-center justify-center w-7 h-7 rounded-full ${badgeBg} font-bold text-xs">
            0${index + 1}
          </span>
          <div class="flex-1 min-w-0">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="group">
              <h3 class="text-base font-bold text-slate-900 ${hoverTitle} transition-colors leading-snug">
                ${item.title_zh}
              </h3>
            </a>
            <p class="mt-0.5 text-xs text-slate-400 italic truncate">${item.title_en}</p>
            <div class="mt-2.5 p-2.5 bg-slate-50 rounded-lg border border-slate-100">
              <p class="text-sm text-slate-700 leading-relaxed">${item.summary_zh}</p>
            </div>
            <div class="mt-3 flex flex-wrap items-center gap-y-1.5 gap-x-3 text-xs text-slate-400">
              <span class="font-medium text-slate-600 bg-slate-100 px-2 py-0.5 rounded">
                來源：${item.source}
              </span>
              <span>${item.published_at}</span>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 font-medium hover:underline ml-auto">
                閱讀原文 &rarr;
              </a>
            </div>
          </div>
        </div>
      `;
      return card;
    }

    async function loadDailyNews() {
      const publicList = document.getElementById('public-news-list');
      const techList = document.getElementById('tech-news-list');
      const timeElement = document.getElementById('updated-time');

      try {
        const res = await fetch(`data/news.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error('新聞資料暫時無法載入');
        const data = await res.json();

        timeElement.textContent = `最後更新時間：${data.updated_at}`;
        publicList.innerHTML = '';
        techList.innerHTML = '';

        // 渲染民生大眾新聞 (3則)
        if (data.public_articles && data.public_articles.length > 0) {
          data.public_articles.forEach((item, index) => {
            publicList.appendChild(renderCard(item, index, "amber"));
          });
        } else {
          publicList.innerHTML = '<li class="p-4 bg-white rounded-lg text-sm text-slate-500">今日暫無顯著之民生衝擊資安新聞。</li>';
        }

        // 渲染資工核心技術 (5則)
        if (data.core_articles && data.core_articles.length > 0) {
          data.core_articles.forEach((item, index) => {
            techList.appendChild(renderCard(item, index, "blue"));
          });
        } else {
          techList.innerHTML = '<li class="p-4 bg-white rounded-lg text-sm text-slate-500">今日尚無技術文章。</li>';
        }

      } catch (err) {
        timeElement.textContent = '載入失敗';
        publicList.innerHTML = `<li class="p-4 bg-red-50 text-red-600 rounded-lg text-sm">${err.message}</li>`;
        techList.innerHTML = '';
      }
    }

    loadDailyNews();
  </script>
</body>
</html>
